[package]
name = "mcrs-repeater"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.9.3", default-features = false }
critical-section = "1.2.0"
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "hazmat"] }
embassy-sync = "0.8.0"
embedded-hal-async = "1.0.0"
embedded-storage = "0.3.1"
hmac = { version = "0.13", default-features = false }
mcrs-protocol = { path = "../protocol" }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
